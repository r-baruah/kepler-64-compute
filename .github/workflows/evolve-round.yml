# One cosmological-natural-selection (SPSA) iteration as work units (docs/v1/08_DISTRIBUTED_COMPUTE.md
# in r-baruah/kepler-64): plan -> build -> N shards -> reduce + commit -> next.
# Started by hand; it re-dispatches itself until `rounds` is reached or
# runs/<run>/STOP exists.
name: evolve-round

on:
  workflow_dispatch:
    inputs:
      run: { description: "run name (folder under runs/)", required: true }
      rounds: { description: "total iterations for this run", default: "200" }
      shards: { description: "parallel shards (max 20)", default: "20" }
      games: { description: "opening pairs per iteration (split across shards)", default: "400" }
      depth: { description: "search depth", default: "4" }
      lr: { description: "unused for evolve (a0/A/c0 come from the checkpoint or defaults)", default: "0" }
      seed: { description: "base seed", default: "1" }
      gen: { description: "starting generation file", default: "engine/data/generations/gen-000.json" }

permissions:
  contents: write
  actions: write

concurrency:
  group: evolve-${{ inputs.run }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.p.outputs.go }}
      round: ${{ steps.p.outputs.round }}
      gen: ${{ steps.p.outputs.gen }}
      state: ${{ steps.p.outputs.state }}
      matrix: ${{ steps.p.outputs.matrix }}
      per_shard: ${{ steps.p.outputs.per_shard }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          dir="runs/${{ inputs.run }}"
          done=$(ls "$dir"/evolve-checkpoint-*.json 2>/dev/null | wc -l)
          round=$((done + 1))
          if [ -f "$dir/STOP" ] || [ "$round" -gt "${{ inputs.rounds }}" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$done" -gt 0 ]; then
            gen="$dir/candidate.json"; state=$(ls "$dir"/evolve-checkpoint-*.json | sort | tail -1)
          else
            gen="${{ inputs.gen }}"; state=none
          fi
          n=${{ inputs.shards }}
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "round=$round" >> "$GITHUB_OUTPUT"
          echo "gen=$gen" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "per_shard=$(( ${{ inputs.games }} / n ))" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"
          echo "round $round of ${{ inputs.rounds }}, gen $gen, state $state"

  build:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pinned toolchain (engine/rust-toolchain.toml)
        working-directory: engine
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - run: cargo build --release --locked -p kepler-train
        working-directory: engine
      - name: determinism check (docs/v1/08 rule D8)
        working-directory: engine
        run: target/release/kepler-train determinism-check --reference data/determinism/reference.json
      - uses: actions/upload-artifact@v4
        with: { name: kepler-train, path: engine/target/release/kepler-train, retention-days: 2 }

  shard:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kepler-train, path: bin }
      - run: |
          chmod +x bin/kepler-train
          bin/kepler-train evolve-shard \
            --gen "${{ needs.plan.outputs.gen }}" --state "${{ needs.plan.outputs.state }}" \
            --openings engine/data/openings/balanced-200.epd \
            --iter $(( ${{ needs.plan.outputs.round }} - 1 )) --seed ${{ inputs.seed }} \
            --shard-index ${{ matrix.k }} --pairs ${{ needs.plan.outputs.per_shard }} \
            --depth ${{ inputs.depth }} --threads $(nproc) \
            --out shard-$(printf %02d ${{ matrix.k }}).json
      - uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.k }}", path: "shard-*.json", retention-days: 2 }

  reduce:
    needs: [plan, build, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kepler-train, path: bin }
      - uses: actions/download-artifact@v4
        with: { pattern: "shard-*", path: shards, merge-multiple: true }
      - run: |
          chmod +x bin/kepler-train
          dir="runs/${{ inputs.run }}"
          mkdir -p "$dir/shards/round-$(printf %03d ${{ needs.plan.outputs.round }})"
          cp shards/*.json "$dir/shards/round-$(printf %03d ${{ needs.plan.outputs.round }})/"
          bin/kepler-train evolve-reduce --state "${{ needs.plan.outputs.state }}" \
            --gen "${{ needs.plan.outputs.gen }}" --shard-dir shards --out-dir "$dir"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$dir/round-$(printf %03d ${{ needs.plan.outputs.round }}).run-url"
      - name: commit
        run: |
          git config user.name "kepler-compute"
          git config user.email "kepler-compute@users.noreply.github.com"
          git add runs
          git commit -m "evolve ${{ inputs.run }}: iteration ${{ needs.plan.outputs.round }}"
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase -q && git push -q && break
            echo "push rejected (another run committed first); retry $i"; sleep $((RANDOM % 20 + 5))
          done
      - name: next round
        if: ${{ fromJSON(needs.plan.outputs.round) < fromJSON(inputs.rounds) }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh workflow run evolve-round.yml --ref "${{ github.ref_name }}" \
            -f run="${{ inputs.run }}" -f rounds="${{ inputs.rounds }}" -f shards="${{ inputs.shards }}" \
            -f games="${{ inputs.games }}" -f depth="${{ inputs.depth }}" -f lr="${{ inputs.lr }}" \
            -f seed="${{ inputs.seed }}" -f gen="${{ inputs.gen }}"
